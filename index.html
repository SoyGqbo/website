<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoyGqbo</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/ia-writer-duospace');

  :root{
    --bg: #000000;
    --card: #000000;
    --border: #ffffff;
    --text: #ffffff;
    --muted: #ffffff;
    --mono: "iA Writer Duospace", ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -5%;
    background-image: url('bg.png');
    background-size: cover;
    background-position: center;
    opacity: 0.25;
    z-index: 0;
    animation: bgDrift 18s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes bgDrift {
    0%   { transform: scale(1.05) translate(0%, 0%); }
    50%  { transform: scale(1.12) translate(-2%, 1.5%); }
    100% { transform: scale(1.05) translate(1.5%, -1%); }
  }

  .stack {
    position: relative;
    z-index: 1;
  }

  .stack {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  }

  a.card:hover {
    transform: translateY(-2px) rotate(1.5deg);
    background: #ffffff;
    color: #000000;
    box-shadow: 0 0 60px 10px rgba(59, 130, 246, 0.18);
  }

  a.card:hover .avatar,
  a.card:hover .project-icon {
    border-color: #000000;
  }

  a.card:active {
    transform: translateY(0px) scale(0.99);
  }

  a.card:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 3px;
  }

  /* Profile card */
  .profile {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .avatar {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 14px;
    object-fit: cover;
    background: #000000;
    border: 1px solid var(--border);
  }

  .profile-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  /* Block cursor, iA Writer style */
  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: currentColor;
    vertical-align: -0.15em;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }

  a.card:hover .cursor {
    background: #000000;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .role {
    font-size: 13px;
    color: var(--muted);
    opacity: 0.6;
    text-transform: lowercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  a.card:hover .role {
    color: #000000;
    opacity: 0.6;
  }

  /* Project card */
  a.card.project {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .project-icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    object-fit: cover;
    background: #000000;
    border: 1px solid var(--border);
  }

  .project-text {
    flex: 1;
    min-width: 0;
  }

  .project-title {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .project-title .arrow {
    transition: transform 0.18s ease;
  }

  a.card:hover .arrow {
    transform: translateX(3px);
  }

  .project-sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    opacity: 0.6;
    text-transform: lowercase;
  }

  a.card:hover .project-sub {
    color: #000000;
    opacity: 0.6;
  }

  /* Instagram icon button */
  .insta-btn {
    align-self: flex-start;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    text-decoration: none;
    transition: transform 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  }

  .insta-btn svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    overflow: visible;
  }

  .insta-btn svg rect {
    fill: #000000;
    transition: fill 0.18s ease;
  }

  .insta-btn:hover {
    transform: translateY(-2px) rotate(1.5deg);
    color: #000000;
    box-shadow: 0 0 40px 8px rgba(59, 130, 246, 0.18);
  }

  .insta-btn:hover svg rect {
    fill: #ffffff;
  }

  .insta-btn:active {
    transform: translateY(0px) scale(0.95);
  }

  .insta-btn:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 3px;
  }
</style>
</head>
